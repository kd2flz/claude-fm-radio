<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude FM Radio</title>
  </head>
  <body>
    <h1>Claude FM Radio</h1>
    <p>Stream: <a href="/stream">/stream</a></p>
    <p>Playlist: <a href="/radio.m3u">/radio.m3u</a></p>
    <audio controls src="/stream" autoplay></audio>
    <p id="status"></p>
    <script>
      const audio = document.querySelector('audio');
      const status = document.getElementById('status');
      function retry() {
        status.textContent = 'Stream unavailable, retrying...';
        setTimeout(() => { audio.src = '/stream?refresh=1&t=' + Date.now(); audio.load(); audio.play().catch(()=>{}); }, 5000);
      }
      audio.addEventListener('error', retry);
      audio.addEventListener('playing', () => { status.textContent = ''; });
    </script>
  </body>
</html>
